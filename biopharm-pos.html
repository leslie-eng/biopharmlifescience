<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Biopharm POS — Dhibiti Model</title>
<style>
*, *::before, *::after { box-sizing: border-box; }
body { margin: 0; -webkit-text-size-adjust: 100%; }
/* Biopharm Life Science brand palette — navy blue / black / white / gold */
:root {
  --accent: #0e4a86;
  --accent-dark: #082c52;
  --accent-tint: #e9eff8;
  --ink: #0c0d10;
  --nav-bg: #0a0c10;
  --nav-bg-2: #12151c;
  --gold: #c9a227;
  --gold-dark: #a3821e;
  --gold-tint: #faf3df;
  --muted: #5b616b;
  --border: #e2e4ea;
  --bg: #f7f8fa;
  --warn: #b8862f;
  --danger: #b3261e;
}
.pos-app {
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  color: var(--ink);
  background: var(--bg);
  min-height: 100vh;
}
.pos-login {
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
}

.pos-shell { display: flex; min-height: 100vh; }

.pos-nav {
  width: 220px;
  background: linear-gradient(180deg, var(--nav-bg-2), var(--nav-bg));
  color: #f2f3f5;
  padding: 20px 14px;
  display: flex;
  flex-direction: column;
  gap: 4px;
  border-right: 2px solid var(--gold);
}
.pos-nav__brand { font-weight: 700; font-size: 15px; margin-bottom: 2px; color: var(--gold); letter-spacing: 0.02em; }
.pos-nav__role { font-size: 11px; opacity: 0.75; margin-bottom: 20px; text-transform: uppercase; letter-spacing: 0.05em; color: #cfd3da; }
.pos-nav__link {
  padding: 9px 12px; border-radius: 6px; color: #cfd3da; text-decoration: none;
  font-size: 14px; cursor: pointer; border: none; background: none; text-align: left;
}
.pos-nav__link:hover { background: rgba(255,255,255,0.08); color: #fff; }
.pos-nav__link--active { background: var(--gold); color: #16130a; font-weight: 700; }
.pos-nav__logout { margin-top: auto; font-size: 13px; opacity: 0.8; color: #e7e9ec; }
.pos-nav__logout:hover { color: var(--gold); background: rgba(201,162,39,0.12); }

.pos-main { flex: 1; padding: 28px 34px; overflow-x: auto; }
.pos-h1 { font-size: 22px; font-weight: 700; margin: 0 0 4px; color: var(--ink); }
.pos-sub { color: var(--muted); font-size: 13px; margin: 0 0 22px; }

.pos-card { background: #fff; border: 1px solid var(--border); border-radius: 10px; padding: 18px; margin-bottom: 16px; }
.pos-grid { display: grid; gap: 16px; }
.pos-grid--2 { grid-template-columns: 1fr 1fr; }
.pos-grid--3 { grid-template-columns: repeat(3, 1fr); }

.pos-kpi { border-radius: 10px; padding: 16px 18px; background: var(--accent-tint); border-left: 3px solid var(--gold); }
.pos-kpi__label { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.04em; }
.pos-kpi__value { font-size: 24px; font-weight: 700; color: var(--accent-dark); margin-top: 4px; }

table.pos-table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
.pos-table th { text-align: left; font-size: 11px; text-transform: uppercase; letter-spacing: 0.04em; color: var(--muted); border-bottom: 2px solid var(--ink); padding: 8px 10px; }
.pos-table td { padding: 9px 10px; border-bottom: 1px solid #eef0f3; }
.pos-table tr:hover td { background: #fafbfd; }

.pos-btn { background: var(--accent); color: #fff; border: none; padding: 9px 16px; border-radius: 7px; font-size: 13.5px; font-weight: 600; cursor: pointer; }
.pos-btn:hover { background: var(--accent-dark); }
.pos-btn--gold { background: var(--gold); color: #16130a; }
.pos-btn--gold:hover { background: var(--gold-dark); }
.pos-btn--ghost { background: transparent; color: var(--accent-dark); border: 1px solid var(--border); }
.pos-btn--danger { background: var(--danger); }
.pos-btn:disabled { opacity: 0.5; cursor: not-allowed; }

.pos-confirm-overlay {
  position: fixed; inset: 0; background: rgba(10,12,16,0.55);
  display: flex; align-items: center; justify-content: center;
  z-index: 1000; padding: 16px;
}
.pos-confirm-box {
  background: #fff; border-radius: 12px; max-width: 380px; width: 100%;
  padding: 22px; border-top: 4px solid var(--danger);
  box-shadow: 0 12px 40px rgba(0,0,0,0.3);
}
.pos-confirm-title { font-weight: 700; font-size: 16px; color: var(--ink); margin-bottom: 8px; }
.pos-confirm-message { font-size: 13.5px; color: var(--muted); margin-bottom: 18px; line-height: 1.5; }
.pos-confirm-actions { display: flex; justify-content: flex-end; gap: 8px; }

.pos-input, .pos-select {
  border: 1px solid var(--border); border-radius: 7px; padding: 8px 10px; font-size: 13.5px; width: 100%;
  background: #fff; color: var(--ink);
}
.pos-input:focus, .pos-select:focus { outline: none; border-color: var(--gold); box-shadow: 0 0 0 3px rgba(201,162,39,0.18); }
.pos-label { font-size: 12px; color: var(--muted); margin-bottom: 4px; display: block; }
.pos-field { margin-bottom: 12px; }

.pos-badge { font-size: 11px; padding: 2px 8px; border-radius: 20px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.03em; }
.pos-badge--ok { background: var(--gold-tint); color: var(--gold-dark); }
.pos-badge--warn { background: #fbeee6; color: var(--warn); }
.pos-badge--danger { background: #fbe6e5; color: var(--danger); }
.pos-badge--muted { background: #eef1f0; color: var(--muted); }

.pos-login { display: flex; align-items: center; justify-content: center; min-height: 100vh; background: radial-gradient(circle at 50% 0%, #16233a, var(--nav-bg) 65%); }
.pos-login__card { background: #fff; padding: 36px 34px; border-radius: 12px; width: 340px; border-top: 4px solid var(--gold); box-shadow: 0 20px 50px rgba(0,0,0,0.35); }
.pos-login__title { font-size: 18px; font-weight: 700; margin-bottom: 2px; color: var(--accent-dark); }
.pos-login__sub { font-size: 12.5px; color: var(--muted); margin-bottom: 22px; }
.pos-error { color: var(--danger); font-size: 12.5px; margin-top: 8px; }

.pos-cart-row { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid #eef0f3; font-size: 13.5px; }
.pos-cart-total { display: flex; justify-content: space-between; font-weight: 700; font-size: 16px; padding-top: 12px; color: var(--accent-dark); }

/* ===== Modal overlay (e.g. inventory edit) ===== */
.pos-modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(10, 12, 16, 0.55);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 1000;
  padding: 20px;
}
.pos-modal-card {
  margin: 0;
  width: 100%;
  max-height: 90vh;
  overflow-y: auto;
  box-shadow: 0 24px 60px rgba(0,0,0,0.4);
}

/* ===== Collapsible sidebar (desktop + mobile) ===== */
.pos-nav__toggle {
  background: transparent; border: none; color: #f2f3f5; cursor: pointer;
  font-size: 18px; line-height: 1; padding: 6px 8px; margin-bottom: 10px;
  border-radius: 6px; align-self: flex-start; flex-shrink: 0;
}
.pos-nav__toggle:hover { background: rgba(255,255,255,0.1); }

.pos-nav--collapsed { width: 52px !important; padding-left: 6px; padding-right: 6px; }
.pos-nav--collapsed .pos-nav__brand,
.pos-nav--collapsed .pos-nav__role,
.pos-nav--collapsed .pos-nav__link,
.pos-nav--collapsed .pos-nav__logout { display: none; }
.pos-nav--collapsed .pos-nav__toggle { margin-bottom: 0; }

/* ===== Mobile / tablet responsive overrides ===== */
@media (max-width: 768px) {
  .pos-shell { flex-direction: column; }

  .pos-nav {
    width: 100% !important;
    flex-direction: row;
    align-items: center;
    gap: 2px;
    padding: 8px 10px;
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
    white-space: nowrap;
    border-right: none;
    border-bottom: 2px solid var(--gold);
    position: sticky;
    top: 0;
    z-index: 100;
  }
  .pos-nav__brand { flex-shrink: 0; margin-bottom: 0; margin-right: 6px; font-size: 14px; }
  .pos-nav__role { display: none; }
  .pos-nav__link { flex-shrink: 0; padding: 10px 12px; min-height: 40px; display: flex; align-items: center; }
  .pos-nav__logout { margin-top: 0; margin-left: 4px; flex-shrink: 0; }
  .pos-nav__toggle { margin-bottom: 0; margin-right: 4px; }

  .pos-nav--collapsed { width: 100% !important; }
  .pos-nav--collapsed .pos-nav__brand { display: flex; }

  .pos-main { padding: 14px 12px 40px; overflow-x: hidden; }
  .pos-h1 { font-size: 19px; }
  .pos-sub { font-size: 12.5px; margin-bottom: 16px; }

  .pos-grid--2, .pos-grid--3 { grid-template-columns: 1fr !important; }

  .pos-card {
    max-width: 100% !important;
    width: 100% !important;
    padding: 14px;
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
  }

  table.pos-table { font-size: 12.5px; }
  .pos-table th, .pos-table td { padding: 8px 6px; }

  .pos-btn {
    min-height: 44px;
    padding: 10px 16px;
    font-size: 14.5px;
  }

  .pos-input, .pos-select {
    font-size: 16px !important; /* prevents iOS auto-zoom on focus */
    min-height: 44px;
    padding: 9px 11px;
  }

  .pos-login__card { width: 90%; max-width: 340px; padding: 28px 22px; }
  .pos-kpi__value { font-size: 20px; }
  .pos-kpi { padding: 14px 16px; }
}

@media (max-width: 400px) {
  .pos-nav__link { font-size: 13px; padding: 9px 10px; }
  .pos-nav__brand { font-size: 13px; }
  .pos-h1 { font-size: 17px; }
}
</style>
</head>
<body>
<div id="root"></div>
<script>
window.posConfirm = function (message, opts) {
  opts = opts || {};
  return new Promise(function (resolve) {
    var overlay = document.createElement("div");
    overlay.className = "pos-confirm-overlay";
    var box = document.createElement("div");
    box.className = "pos-confirm-box";
    var titleEl = document.createElement("div");
    titleEl.className = "pos-confirm-title";
    titleEl.textContent = opts.title || "Please confirm";
    var msgEl = document.createElement("div");
    msgEl.className = "pos-confirm-message";
    msgEl.textContent = message;
    var btnRow = document.createElement("div");
    btnRow.className = "pos-confirm-actions";
    var cancelBtn = document.createElement("button");
    cancelBtn.type = "button";
    cancelBtn.className = "pos-btn pos-btn--ghost";
    cancelBtn.textContent = opts.cancelLabel || "Cancel";
    var confirmBtn = document.createElement("button");
    confirmBtn.type = "button";
    confirmBtn.className = "pos-btn pos-btn--danger";
    confirmBtn.textContent = opts.confirmLabel || "Delete";
    function close(result) {
      document.removeEventListener("keydown", onKeydown);
      overlay.remove();
      resolve(result);
    }
    function onKeydown(e) {
      if (e.key === "Escape") close(false);
    }
    cancelBtn.onclick = function () { close(false); };
    confirmBtn.onclick = function () { close(true); };
    overlay.onclick = function (e) { if (e.target === overlay) close(false); };
    document.addEventListener("keydown", onKeydown);
    btnRow.appendChild(cancelBtn);
    btnRow.appendChild(confirmBtn);
    box.appendChild(titleEl);
    box.appendChild(msgEl);
    box.appendChild(btnRow);
    overlay.appendChild(box);
    document.body.appendChild(overlay);
    confirmBtn.focus();
  });
};
</script>
