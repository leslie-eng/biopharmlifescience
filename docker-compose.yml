# Local databases only. The frontend and backend run natively (see README.md), the same
# way Vercel and Render run them. Credentials here are for local throwaway databases.
#
#   docker compose up -d db        # development database, used by backend/.env
#   docker compose up -d db-test   # wiped by every pytest run (backend/tests/conftest.py)
#   docker compose up -d s3        # product images, for development and tests

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: dev
      POSTGRES_DB: biolinks
    ports:
      - "55433:5432"   # not 5432/5433, so it never collides with a locally installed Postgres
    volumes:
      - biolinks-dev-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d biolinks"]
      interval: 5s
      retries: 10

  db-test:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: test
      POSTGRES_DB: biolinks_test
    ports:
      - "55432:5432"

  # S3-compatible object storage standing in for the production bucket (product images).
  # Accepts any access key/secret; buckets biolinks-dev (development) and biolinks-test (pytest).
  s3:
    image: adobe/s3mock:latest
    environment:
      COM_ADOBE_TESTING_S3MOCK_STORE_INITIAL_BUCKETS: biolinks-dev,biolinks-test
      COM_ADOBE_TESTING_S3MOCK_STORE_RETAIN_FILES_ON_EXIT: "true"
    ports:
      - "59000:9090"
    volumes:
      - biolinks-dev-s3:/tmp/s3mock

volumes:
  biolinks-dev-data:
  biolinks-dev-s3:
